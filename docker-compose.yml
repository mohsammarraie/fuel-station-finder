services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: fuel_station_finder
      POSTGRES_USER: fuel_station
      POSTGRES_PASSWORD: fuel_station
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_station -d fuel_station_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
