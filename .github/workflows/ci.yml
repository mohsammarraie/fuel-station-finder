name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fuel_station:fuel_station@localhost:5432/fuel_station_finder
      DATABASE_SSL: "false"
    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: fuel_station_finder
          POSTGRES_USER: fuel_station
          POSTGRES_PASSWORD: fuel_station
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuel_station -d fuel_station_finder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Verify repeatable migrations
        run: npm run db:migrate

      - name: Seed example data
        run: npm run db:seed

      - name: Verify repeatable seed
        run: npm run db:seed

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
